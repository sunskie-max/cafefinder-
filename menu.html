<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menus • Cafe Finder</title>

  <!-- same font + CSS as home -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    .menu-wrap{max-width:900px;margin:22px auto}
    .menu-group{margin:18px 0}
    .menu-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
    .item{border:1px solid var(--ring);background:#fff;border-radius:12px;padding:12px}
    .price{float:right;color:var(--muted);font-weight:700}
    .list{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0}
    .list a{border:1px solid var(--ring);background:#fff;padding:6px 10px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600}
  </style>
</head>
<body>
  <header>
    <h1 id="title">Menu</h1>
    <p id="subtitle">Loading café…</p>
  </header>

  <main class="container menu-wrap">
    <article class="cafe-card">
      <div class="thumb"><img id="hero" alt=""></div>
      <div class="card-body">
        <h2 id="cname"></h2>
        <p class="address" id="addr"></p>

        <div id="menus"></div>

        <div class="actions" style="margin-top:12px">
          <a href="index.html" class="btn btn-outline">← Back to home</a>
          <a id="dirbtn" class="btn" target="_blank" rel="noopener">Open Directions</a>
        </div>

        <div id="chooser" style="margin-top:14px"></div>
      </div>
    </article>
  </main>

  <script>
  // helpers
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  const photoSrc = name => `images/cafes/${slug(name)}.jpg`;

  async function load() {
    const hash = location.hash.slice(1); // slug after '#'
    const res = await fetch('export.geojson');   // use your file name here
    const gj  = await res.json();

    // map GeoJSON → list of cafes with coords
    const cafes = (gj.features||[]).map(f=>{
      const p=f.properties||{}, g=f.geometry||{};
      let lon,lat;
      if (g.type==='Point') [lon,lat]=g.coordinates;
      else if (g.type==='Polygon') [lon,lat]=centroid(g.coordinates[0]);
      else if (g.type==='MultiPolygon') [lon,lat]=centroid(g.coordinates[0][0]);
      const addr=[p["addr:housenumber"],p["addr:street"],p["addr:city"]||"Hyderabad"].filter(Boolean).join(' ');
      return { name:p.name||'Unnamed Cafe', lat, lon, addr, slug: slug(p.name||'unnamed') };
    }).filter(c=>Number.isFinite(c.lat)&&Number.isFinite(c.lon));

    // if no slug or not found → show chooser
    const cafe = cafes.find(c=>c.slug===hash);
    if (!cafe) {
      document.getElementById('subtitle').textContent = 'Pick a café:';
      const chooser = document.getElementById('chooser');
      chooser.innerHTML = `<div class="list">${
        cafes.slice(0,30).map(c=>`<a href="#${c.slug}" onclick="location.reload()">${c.name}</a>`).join('')
      }</div>`;
      return;
    }

    // fill header + hero
    document.getElementById('subtitle').textContent = cafe.name;
    document.getElementById('cname').textContent    = cafe.name;
    document.getElementById('addr').textContent     = cafe.addr || 'Hyderabad';
    const hero = document.getElementById('hero');
    hero.src = photoSrc(cafe.name);
    hero.alt = cafe.name;
    hero.onerror = ()=>{hero.src='images/cafe1.jpg'};

    // directions button
    const dir = document.getElementById('dirbtn');
    dir.href = `directions.html#${cafe.slug}`;

    // simple default menu (replace with your real items later)
    const defaultMenu = {
      "Espresso Bar":[["Espresso","₹100"],["Cappuccino","₹140"],["Latte","₹150"]],
      "Iced & Cold":[["Cold Brew","₹180"],["Iced Latte","₹170"]],
      "Bakery":[["Croissant","₹140"],["Muffin","₹120"]]
    };
    renderMenu(defaultMenu);
  }

  function renderMenu(data){
    const wrap = document.getElementById('menus');
    wrap.innerHTML = Object.entries(data).map(([group, items]) => `
      <div class="menu-group">
        <h3>${group}</h3>
        <div class="menu-items">
          ${items.map(([name,price])=>`<div class="item">${name}<span class="price">${price}</span></div>`).join('')}
        </div>
      </div>
    `).join('');
  }

  // polygon centroid
  function centroid(ring){
    let A=0,cx=0,cy=0;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const [x0,y0]=ring[j],[x1,y1]=ring[i]; const f=x0*y1-x1*y0;
      A+=f; cx+=(x0+x1)*f; cy+=(y0+y1)*f;
    }
    A*=0.5; if(!A){ const lon=ring.reduce((s,[x])=>s+x,0)/ring.length; const lat=ring.reduce((s,[,y])=>s+y,0)/ring.length; return [lon,lat];}
    return [cx/(6*A), cy/(6*A)];
  }

  load();
  </script>
</body>
</html>
